<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>PlaySplit - Smart Badminton Court Shuffling</title>
		<meta name="description" content="PlaySplit — smart badminton court shuffling app. Create balanced 4-player courts, visualize rotations, track scores, and manage players/groups with an offline-first experience." />
		<style>
			*{margin:0;padding:0;box-sizing:border-box}
			body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column}

			/* ─── Hero with background image ─── */
			.hero{
				position:relative;
				min-height:100vh;
				background:url('/assets/playsplit-promo.png') center top / cover no-repeat;
				display:flex;
				flex-direction:column;
				align-items:center;
				justify-content:flex-end;
				padding:40px 20px 48px;
			}
			/* dark gradient overlay so text/badges pop */
			.hero::before{
				content:'';
				position:absolute;inset:0;
				background:linear-gradient(to bottom,rgba(0,0,0,0) 30%,rgba(0,0,0,0.55) 100%);
				pointer-events:none;
			}

			/* ─── Content card at the bottom of viewport ─── */
			.content{
				position:relative;          /* above the overlay */
				text-align:center;
				max-width:520px;
				width:100%;
			}
			.content h1{
				font-size:2.2rem;
				font-weight:700;
				margin:0 0 10px;
				text-shadow:0 2px 6px rgba(0,0,0,0.35);
			}
			.content p{
				font-size:1.05rem;
				line-height:1.5;
				margin:0 0 24px;
				opacity:0.92;
				text-shadow:0 1px 4px rgba(0,0,0,0.3);
			}

			/* ─── Store badges ─── */
			.cta{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
			.cta a{
				display:inline-block;
				transition:transform .15s ease;
			}
			.cta a:hover{transform:scale(1.05)}
			.cta img{height:48px;border-radius:8px}

			/* ─── Responsive tweaks ─── */
			@media(max-width:480px){
				.hero{padding:24px 16px 36px}
				.content h1{font-size:1.6rem}
				.content p{font-size:0.95rem}
				.cta img{height:40px}
			}
		</style>

		<!-- Structured data / Social metadata -->
		<meta itemprop="name" content="PlaySplit - Smart Badminton Court Shuffling" />
		<meta itemprop="description" content="Organize badminton sessions instantly with balanced 4-player court shuffles, court visualization, rotations and score tracking." />
		<meta itemprop="image" content="/assets/playsplit-promo.png" />

		<meta property="og:title" content="PlaySplit - Smart Badminton Court Shuffling" />
		<meta property="og:description" content="Organize badminton sessions instantly with balanced 4-player court shuffles, court visualization, rotations and score tracking." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="" />
		<meta property="og:image" content="/assets/playsplit-promo.png" />
		<meta property="og:site_name" content="PlaySplit" />
	</head>
	<body>
		<section class="hero">
			<div class="content">
				<h1>PlaySplit</h1>
				<p>Smart rotation for badminton players — balance courts by skill, visualize lineups, and track scores.</p>
				<div class="cta">
					<a href="https://apps.apple.com/app/playsplit/id6743197498" target="_blank" rel="noopener">
						<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" />
					</a>
					<a href="https://play.google.com/store/apps/details?id=com.kalai.k.t.playsplit" target="_blank" rel="noopener">
						<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" />
					</a>
				</div>
			</div>
		</section>
	</body>
</html>
